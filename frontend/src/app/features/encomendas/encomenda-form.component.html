<h2 mat-dialog-title>{{ titulo }}</h2>

<form [formGroup]="form" (ngSubmit)="salvar()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Tipo</mat-label>
      <mat-select formControlName="tipo">
        @for (t of tipos; track t) {
          <mat-option [value]="t">{{ t }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Tamanho</mat-label>
      <mat-select formControlName="tamanho">
        @for (t of tamanhos; track t) {
          <mat-option [value]="t">{{ t }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Peso (kg)</mat-label>
      <input matInput type="number" step="0.01" min="0.01" formControlName="peso" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Volume (m3)</mat-label>
      <input matInput type="number" step="0.01" min="0.01" formControlName="volume" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Preco da entrega (R$)</mat-label>
      <input matInput type="number" step="0.01" min="0" formControlName="preco" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Cliente</mat-label>
      <mat-select formControlName="clienteId">
        @for (c of clientes; track c.id) {
          <mat-option [value]="c.id">{{ c.nome }}</mat-option>
        }
      </mat-select>
      @if (clientes.length === 0) {
        <mat-hint>Nenhum cliente cadastrado.</mat-hint>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit">Salvar</button>
  </mat-dialog-actions>
</form>

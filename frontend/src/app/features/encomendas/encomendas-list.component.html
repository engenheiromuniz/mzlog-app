<div class="mzlog-page">
  <div class="page-header">
    <h1>Encomendas</h1>
    <button mat-raised-button color="primary" (click)="novo()">
      <mat-icon>add</mat-icon>
      Nova encomenda
    </button>
  </div>

  <table mat-table [dataSource]="encomendas" class="mzlog-table">
    <ng-container matColumnDef="tipo">
      <th mat-header-cell *matHeaderCellDef>Tipo</th>
      <td mat-cell *matCellDef="let e">{{ e.tipo }}</td>
    </ng-container>

    <ng-container matColumnDef="tamanho">
      <th mat-header-cell *matHeaderCellDef>Tamanho</th>
      <td mat-cell *matCellDef="let e">{{ e.tamanho }}</td>
    </ng-container>

    <ng-container matColumnDef="peso">
      <th mat-header-cell *matHeaderCellDef>Peso</th>
      <td mat-cell *matCellDef="let e">{{ e.peso }} kg</td>
    </ng-container>

    <ng-container matColumnDef="volume">
      <th mat-header-cell *matHeaderCellDef>Volume</th>
      <td mat-cell *matCellDef="let e">{{ e.volume }} m3</td>
    </ng-container>

    <ng-container matColumnDef="preco">
      <th mat-header-cell *matHeaderCellDef>Preco</th>
      <td mat-cell *matCellDef="let e">{{ e.preco | currency: 'BRL' }}</td>
    </ng-container>

    <ng-container matColumnDef="clienteNome">
      <th mat-header-cell *matHeaderCellDef>Cliente</th>
      <td mat-cell *matCellDef="let e">{{ e.clienteNome }}</td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let e">
        <button mat-icon-button (click)="editar(e)" aria-label="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="remover(e)" aria-label="Remover">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let row; columns: colunas"></tr>
  </table>

  @if (!carregando && encomendas.length === 0) {
    <p class="empty-state">Nenhuma encomenda cadastrada.</p>
  }
</div>

<div class="mzlog-page">
  <div class="page-header">
    <h1>Rotas</h1>
    <button mat-raised-button color="primary" (click)="novo()">
      <mat-icon>add</mat-icon>
      Nova rota
    </button>
  </div>

  <table mat-table [dataSource]="rotas" class="mzlog-table">
    <ng-container matColumnDef="origem">
      <th mat-header-cell *matHeaderCellDef>Origem</th>
      <td mat-cell *matCellDef="let r">{{ r.origem }}</td>
    </ng-container>

    <ng-container matColumnDef="destino">
      <th mat-header-cell *matHeaderCellDef>Destino</th>
      <td mat-cell *matCellDef="let r">{{ r.destino }}</td>
    </ng-container>

    <ng-container matColumnDef="clienteNome">
      <th mat-header-cell *matHeaderCellDef>Cliente</th>
      <td mat-cell *matCellDef="let r">{{ r.clienteNome }}</td>
    </ng-container>

    <ng-container matColumnDef="motoristaNome">
      <th mat-header-cell *matHeaderCellDef>Motorista</th>
      <td mat-cell *matCellDef="let r">{{ r.motoristaNome }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let r">
        <span class="status-badge" [ngClass]="statusClasse(r.status)">{{ r.status }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let r">
        <button mat-icon-button (click)="verMapa(r)" aria-label="Ver mapa">
          <mat-icon>map</mat-icon>
        </button>
        <button mat-icon-button (click)="editar(r)" aria-label="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="remover(r)" aria-label="Remover">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let row; columns: colunas"></tr>
  </table>

  @if (!carregando && rotas.length === 0) {
    <p class="empty-state">Nenhuma rota cadastrada.</p>
  }

  @if (rotaSelecionada) {
    <mat-card class="mapa-card">
      <div class="mapa-card-header">
        <h2>{{ rotaSelecionada.origem }} &rarr; {{ rotaSelecionada.destino }}</h2>
        <button mat-icon-button (click)="fecharMapa()" aria-label="Fechar mapa">
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <app-rota-mapa [origem]="rotaSelecionada.origem" [destino]="rotaSelecionada.destino"></app-rota-mapa>
    </mat-card>
  }
</div>

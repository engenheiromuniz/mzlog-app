<div class="mzlog-page">
  <div class="page-banner-wrap">
    <img class="page-banner" src="assets/img/funcionarios.png" alt="Equipe MZLOG" />
  </div>

  <div class="page-header">
    <h1>Funcionarios</h1>
    <button mat-raised-button color="primary" (click)="novo()">
      <mat-icon>add</mat-icon>
      Novo funcionario
    </button>
  </div>

  <table mat-table [dataSource]="funcionarios" class="mzlog-table">
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let f">{{ f.nome }}</td>
    </ng-container>

    <ng-container matColumnDef="cargo">
      <th mat-header-cell *matHeaderCellDef>Cargo</th>
      <td mat-cell *matCellDef="let f">{{ f.cargo }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let f">
        <mat-chip-set>
          <mat-chip>{{ f.status }}</mat-chip>
        </mat-chip-set>
      </td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let f">
        <button mat-icon-button (click)="editar(f)" aria-label="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="remover(f)" aria-label="Remover">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let row; columns: colunas"></tr>
  </table>

  @if (!carregando && funcionarios.length === 0) {
    <p class="empty-state">Nenhum funcionario cadastrado.</p>
  }
</div>
